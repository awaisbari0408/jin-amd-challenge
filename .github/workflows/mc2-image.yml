# Builds the MC2 image on GitHub's servers and pushes it to ghcr.io.
# No personal tokens: it logs in with the job's built-in GITHUB_TOKEN.
name: mc2 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mc2-ocr/**", ".github/workflows/mc2-image.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: mc2-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/awaisbari0408/jin-mc2
  BASE: rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0
  MODEL: Qwen/Qwen3-VL-8B-Instruct

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /opt/az \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker system prune -af >/dev/null || true
          sudo apt-get clean
          df -h / /mnt || true

      - name: Put Docker storage on the disk with the most room
        run: |
          free_kb() { df --output=avail -k "$1" 2>/dev/null | tail -1 || echo 0; }
          root=$(free_kb /); mnt=$(free_kb /mnt)
          if [ "$mnt" -gt "$root" ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          d=$(docker info --format '{{.DockerRootDir}}')
          echo "Docker storage: $d"; df -h "$d" /
          need=$((60*1024*1024))  # ~60 GB for base + weights + layers
          have=$(df --output=avail -k "$d" | tail -1)
          [ "$have" -ge "$need" ] || { echo "::error::Only $((have/1024/1024)) GB free for Docker; need ~60 GB"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download model weights
        run: |
          pip install -q "huggingface_hub[hf_xet]"
          hf download "$MODEL" --local-dir mc2-ocr/models/Qwen3-VL-8B-Instruct
          rm -rf mc2-ocr/models/Qwen3-VL-8B-Instruct/.cache
          du -sh mc2-ocr/models/Qwen3-VL-8B-Instruct; df -h /

      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE:v1" -t "$IMAGE:sha-${GITHUB_SHA::7}" mc2-ocr
          rm -rf mc2-ocr/models

      - name: Verify (same gates the grader checks)
        run: |
          set -e
          echo "-- torch must still be the ROCm build"
          docker run --rm --entrypoint python3 "$IMAGE:v1" -c "import torch; v=torch.__version__; print(v); assert '+rocm' in v"
          echo "-- size must be under 60 GiB uncompressed"
          size=$(docker image inspect "$IMAGE:v1" --format '{{.Size}}')
          echo "$size bytes = $((size/1024/1024/1024)) GiB"; [ "$size" -lt $((60*1024*1024*1024)) ]
          echo "-- must be built on the mandated base (layer identity)"
          base=$(docker image inspect "$BASE" --format '{{json .RootFS.Layers}}' | tr -d '[]"' | tr ',' '\n')
          ours=$(docker image inspect "$IMAGE:v1" --format '{{json .RootFS.Layers}}' | tr -d '[]"' | tr ',' '\n' | head -n "$(echo "$base" | wc -l)")
          [ "$base" = "$ours" ] && echo "base layers identical"
          echo "-- weights and code are in place"
          docker run --rm --entrypoint sh "$IMAGE:v1" -c "ls -la /models/Qwen3-VL-8B-Instruct/*.safetensors && ls /app/app.py /app/server.py"

      - name: Log in to ghcr.io (built-in token)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          ok=0
          for i in 1 2 3; do docker push --all-tags "$IMAGE" && { ok=1; break; }; echo "push failed, retry $i"; sleep 30; done
          [ "$ok" = 1 ] || { echo "::error::push failed 3 times"; exit 1; }
          docker image inspect "$IMAGE:v1" --format '{{index .RepoDigests 0}}'
